name: Workflow Commands
on: [push]

jobs:
  testing-wf-commands:
    runs-on: ubuntu-latest
    steps:
      - name: Setting an error message
        run: echo "::error::Missing semicolon"
      - name: Setting an error message with parameters
        run: echo "::error title=Error Title,file=app.js::Missing semicolon"
      - name: Setting a debug message with parameters
        run: echo "::debug title=Debut Title,file=app.js::Missing semicolon"
      - name: Setting a warning message with parameters
        run: echo "::warning title=Warning Title,file=app.js::Missing semicolon"
      - name: Setting a notice message with parameters
        run: echo "::notice title=Notice Title,file=app.js::Missing semicolon"
